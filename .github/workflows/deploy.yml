name: Validar y publicar portafolio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validar y compilar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Preparar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Verificar archivos y proyectos
        run: npm run validate
      - name: Compilar Astro
        run: npm run build
      - name: Configurar GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Subir sitio compilado
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    name: Publicar en GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v5
